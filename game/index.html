<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Garuda</title>
<link rel="stylesheet" href="./styles/hud.css" />
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="flight-canvas" aria-label="Garuda flight viewport"></canvas>
<canvas id="hud-canvas" aria-hidden="true"></canvas>
<dialog id="briefing-dialog" aria-labelledby="briefing-title">
<div class="hub-top">
<div class="brand"><svg width="34" height="22" viewBox="0 0 60 36" aria-hidden="true"><path d="M2 14 L24 14 L20 20 L8 20Z M58 14 L36 14 L40 20 L52 20Z M30 4 L39 14 L30 32 L21 14Z" fill="#38bdf8"/></svg><div><span class="kicker">PK-GRD · G1000</span><h1 id="briefing-title">Garuda</h1></div></div>
<div class="top-acts"><span id="hub-badge-count" class="wing-pill">0 / 5 Wings</span><button id="launch-btn" type="button" autofocus>Free Flight</button></div>
</div>
<div id="hub-view" class="hub-main"></div>
<div class="key-foot"><b>A/D</b> Bank · <b>W/S</b> Pitch · <b>Shift/Ctrl</b> Throttle · <b>P</b> Autopilot · <b>X</b> Speedbrake · <b>[/]</b> Trim · <b>F</b> Flaps · <b>G</b> Gear · <b>C</b> Cockpit · <b>Esc</b> Menu</div>
</dialog>
<dialog id="pause-dialog" aria-labelledby="pause-title" closedby="any">
<div class="hub-top">
<h1 id="pause-title">Flight Menu</h1>
<div class="top-acts">
<button id="resume-btn" type="button" autofocus>Resume</button>
<button id="career-btn" type="button">Career Hub</button>
<button id="weather-btn" type="button">SKY: CLEAR [V]</button>
<button id="restart-btn" type="button">Restart</button>
<button id="mute-btn" type="button">Audio: On</button>
</div>
</div>
<div id="mission-list" class="pause-body"></div>
</dialog>
<script type="module" src="./src/main.js"></script>
</body>
</html>
